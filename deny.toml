# Configuration for cargo-deny
# https://embark-studios.github.io/cargo-deny/

# Only consider the platforms STRdust is actually built for (see
# .github/workflows/publish.yml). Without this the graph also carries the
# Windows target shims, which duplicate across windows-sys generations and
# produce warnings nobody can act on.
[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[licenses]
# Allow specific licenses
allow = [
    "MIT",
    "Apache-2.0", 
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause", 
    "ISC",
    "Unicode-3.0",  # Unicode License v3 - used by ICU/Unicode crates
    "Zlib",         # zlib License - used by foldhash crate
    "CDLA-Permissive-2.0",  # Community Data License Agreement - used by webpki-root-certs
]

# Confidence threshold for detecting licenses
confidence-threshold = 0.8

# The allow list is a policy statement, not a mirror of the current dependency
# graph: a permissive license staying in it after the crate that needed it is
# gone is fine, and beats a red build the next time one shows up again.
unused-allowed-license = "allow"

[bans]
# Lint level for when multiple versions of the same crate are detected
multiple-versions = "warn"
# Lint level for when a crate version requirement is `*`
wildcards = "warn"

# Skip certain crates for multiple version checks. Only crates that actually
# have several versions in the resolved graph belong here -- stale entries are
# reported as unmatched/unnecessary skips and drown out the real output.
skip = [
    # Common crates that often have multiple versions due to ecosystem splits
    { name = "rand", reason = "Machine learning crates require different rand versions" },
    { name = "rand_core", reason = "Part of rand ecosystem version splits" },
    { name = "getrandom", reason = "Random number generation, version compatibility" },
    { name = "hashbrown", reason = "HashMap implementation versions" },
    { name = "itertools", reason = "Iterator utilities, ecosystem compatibility" },
    { name = "derive-new", reason = "Different versions in bio ecosystem (0.6 vs 0.7)" },
    { name = "thiserror", reason = "Error handling, v1 vs v2 ecosystem split" },
    { name = "thiserror-impl", reason = "Part of thiserror ecosystem" },
]

[advisories]
# The path where the advisory database is cloned/fetched into
db-path = "~/.cargo/advisory-db"
# The url(s) of the advisory databases to use
db-urls = ["https://github.com/rustsec/advisory-db"]

# Only flag "unmaintained" advisories for crates we depend on directly, not for
# deep transitive build-time dependencies (e.g. proc-macro-error2, paste,
# fxhash, custom_derive pulled in via getset -> bio). Those are unmaintained
# upstream with no safe upgrade and are not a security risk for a CLI, and they
# were causing a new red build every week as fresh advisories were published.
# Actual vulnerabilities (and unsound advisories) still fail the check.
unmaintained = "workspace"

[sources]
# Lint level for what to happen when a crate from a git repository is encountered
unknown-git = "warn"
# Lint level for what to happen when a crate from a registry that is not in the allow list is encountered
unknown-registry = "warn"

allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# rust-htslib is consumed from a fork; allowing it explicitly documents the
# exception instead of leaving a source-not-allowed warning on every run.
allow-git = ["https://github.com/wdecoster/rust-htslib"]
