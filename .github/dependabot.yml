# Dependabot configuration for STRdust.
# Tuned per GitHub's "tame Dependabot" guidance: batch version updates into a
# few grouped PRs on a slow (monthly) cadence, with a release cooldown. Security
# updates ignore groups/schedule and still open immediately.

version: 2
updates:
  # Cargo (Rust)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    reviewers:
      - "wdecoster"
    assignees:
      - "wdecoster"
    commit-message:
      prefix: "cargo"
      prefix-development: "cargo"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    # One grouped PR for all cargo version updates (only patch bumps are allowed
    # below, so majors/minors never open individually).
    groups:
      cargo:
        patterns: ["*"]
    # Wait a few days after a release before opening a version-update PR, so a
    # compromised fresh release has time to be flagged.
    cooldown:
      default-days: 7
    # Conservative posture: only patch version updates (security updates are
    # separate and unaffected by this allow list).
    allow:
      - dependency-type: "direct"
        update-type: "version-update:semver-patch"
      - dependency-type: "indirect"
        update-type: "version-update:semver-patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "04:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    reviewers:
      - "wdecoster"
    assignees:
      - "wdecoster"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
